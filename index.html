<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queensbay Mall Parking Availability | Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="top-line"></div>

    <section id="loginScreen" class="login-page">
      <div class="login-box">
        <div class="brand">
          <div class="welcome">Welcome to</div>
          <div class="logo-text">Queensbay<span class="mall">Mall</span></div>
          <div class="tagline">It's All Happening Here!</div>
        </div>
        <form id="loginForm">
          <input id="loginEmail" class="form-control" type="email" placeholder="Email Address" required />
          <input id="loginPassword" class="form-control" type="password" placeholder="Password" required />
          <button type="button" class="small-link" onclick="alert('Accounts stored in localStorage for this prototype.')">Forgot Password</button>
          <button class="green-btn login-button" type="submit">Log in</button>
          <div class="switch-text">Don't have an account? <a href="register.html">Sign up</a></div>
          <div id="loginMessage" class="message"></div>
        </form>
      </div>
    </section>

    <script src="js/auth.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
